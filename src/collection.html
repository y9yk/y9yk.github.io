<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><meta name="description" content="{{description}}"><meta name="color-scheme" content="light"><meta http-equiv="Content-Security-Policy" content="{{policy}}"><link rel="canonical" href="{{site_url}}"><link rel="icon" href="{{prefix}}assets/favicon.png" type="image/png"><link rel="stylesheet" href="{{prefix}}assets/style.css?v={{version}}"><script src="{{prefix}}assets/site.js?v={{version}}" defer></script><script src="{{prefix}}assets/analytics.js?v={{version}}" data-endpoint="{{analytics_endpoint}}" data-host="{{production_host}}" defer></script></head><body><a class="skip-link" href="#main">Skip to content</a>{{site_header}}<div class="page"><main id="main"><div class="collection-heading"><h1>{{heading}}</h1></div>{{cards}}</main><footer><p>{{name}}</p><a href="{{prefix}}#main">Home</a><a href="{{prefix}}stats/">Stats</a></footer></div></body></html>
