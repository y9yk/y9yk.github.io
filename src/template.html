<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="Yong Ki Lee: data-centric AI services at SK Telecom. Career, projects, education, research, and talks.">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="{{policy}}">
  <link rel="canonical" href="{{site_url}}">
  <meta property="og:type" content="website"><meta property="og:title" content="{{title}}"><meta property="og:url" content="{{site_url}}">
  <meta property="og:description" content="Data-centric AI services, data engineering, machine learning, and backend development.">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preload" href="assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css?v={{version}}"><script src="assets/site.js?v={{version}}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{site_header}}
  <div class="page">
    <main id="main">
      <section class="hero" id="bio" aria-labelledby="name"><div class="hero-text"><div class="identity"><h1 id="name">{{name}}</h1></div><p class="headline">{{headline}}</p><p class="intro">{{intro}}</p>{{bio}}<div class="social-links">{{links}}</div></div></section>
      <section id="career" class="section" aria-labelledby="career-title"><div class="section-heading"><h2 id="career-title">Career</h2></div><div class="timeline">{{career}}</div></section>
      {{fun_section}}
      <section id="research" class="section" aria-labelledby="research-title"><div class="section-heading"><h2 id="research-title">Research &amp; Education</h2></div><div id="education">{{education}}</div><div id="publications" class="papers research-papers">{{papers}}</div></section>
      <section id="talks" class="section" aria-labelledby="talks-title"><div class="section-heading"><h2 id="talks-title">Talks</h2></div>{{talks}}</section>
      <section id="stack" class="section appendix" aria-labelledby="stack-title"><div class="section-heading"><h2 id="stack-title">Stack</h2></div><div class="stack-map">{{stack}}</div></section>
    </main>
    <footer><p>{{name}}</p></footer>
  </div>
</body>
</html>
