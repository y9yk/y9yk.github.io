<svg xmlns="http://www.w3.org/2000/svg" width="800" height="338" viewBox="0 0 800 338" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
<title id="title">NoteOn의 기능</title><desc id="desc">편집자는 강의 노트를 제작한다. 독자는 영상과 노트를 함께 공부하고 계정에 북마크와 문장 메모를 남긴다.</desc>
<rect x="1" y="0.8" width="798" height="336" rx="13" fill="#fff" stroke="#d7dfe3"/>
<text x="32" y="41.6" font-size="19" font-weight="600" fill="#22272b" text-anchor="start">NoteOn의 기능</text>
<text x="32" y="67.2" font-size="14" font-weight="400" fill="#58636b" text-anchor="start">사용자별로 할 수 있는 일</text>
<rect x="32" y="88.8" width="736" height="64" rx="8" fill="#f6f9fb" stroke="#d7dfe3"/>
<text x="58" y="128" font-size="16" font-weight="600" fill="#205f8c" text-anchor="start">편집자</text>
<line x1="159" x2="159" y1="99.2" y2="142.4" stroke="#d7dfe3" stroke-width="1"/>
<text x="184" y="113.6" font-size="17" font-weight="600" fill="#22272b" text-anchor="start">강의 노트 제작</text>
<text x="184" y="139.2" font-size="15" font-weight="400" fill="#58636b" text-anchor="start">공식 영상과 자료를 대조해 구간별 해설을 작성한다.</text>
<rect x="32" y="164" width="736" height="144.8" rx="8" fill="#f6f9fb" stroke="#d7dfe3"/>
<text x="58" y="203.2" font-size="16" font-weight="600" fill="#205f8c" text-anchor="start">독자</text>
<line x1="159" x2="159" y1="174.4" y2="298.4" stroke="#d7dfe3" stroke-width="1"/>
<text x="184" y="188.8" font-size="17" font-weight="600" fill="#22272b" text-anchor="start">강의 학습</text>
<text x="184" y="214.4" font-size="15" font-weight="400" fill="#58636b" text-anchor="start">구간을 선택하고 영상을 보면서 노트를 읽는다.</text>
<text x="184" y="261.6" font-size="17" font-weight="600" fill="#22272b" text-anchor="start">내 학습 기록</text>
<text x="184" y="287.2" font-size="15" font-weight="400" fill="#58636b" text-anchor="start">로그인하면 강의를 북마크하고 문장에 메모를 남긴다.</text>
<line x1="184" x2="740" y1="228" y2="228" stroke="#d7dfe3" stroke-width="1"/>
</svg>
