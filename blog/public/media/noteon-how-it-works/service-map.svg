<svg xmlns="http://www.w3.org/2000/svg" width="800" height="422" viewBox="0 0 800 422" role="img" aria-labelledby="title desc" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans CJK KR, Noto Sans KR, sans-serif">
<title id="title">NoteOn의 기능</title><desc id="desc">편집자는 강의 노트를 제작한다. 독자는 영상과 노트를 함께 공부하고 계정에 북마크와 문장 메모를 남긴다.</desc>
<rect x="1" y="1" width="798" height="420" rx="13" fill="#fff" stroke="#cad5dd"/>
<text x="32" y="52" font-size="29" font-weight="700" fill="#22272b" text-anchor="start">NoteOn의 기능</text>
<text x="32" y="84" font-size="19" font-weight="450" fill="#546471" text-anchor="start">사용자별로 할 수 있는 일</text>
<rect x="32" y="111" width="736" height="80" rx="8" fill="#f5f8fa" stroke="#cad5dd"/>
<text x="58" y="160" font-size="25" font-weight="700" fill="#205f8c" text-anchor="start">편집자</text>
<line x1="159" x2="159" y1="124" y2="178" stroke="#cad5dd" stroke-width="1"/>
<text x="184" y="142" font-size="24" font-weight="650" fill="#22272b" text-anchor="start">강의 노트 제작</text>
<text x="184" y="174" font-size="20" font-weight="450" fill="#546471" text-anchor="start">공식 영상과 자료를 대조해 구간별 해설을 작성한다.</text>
<rect x="32" y="205" width="736" height="181" rx="8" fill="#f5f8fa" stroke="#cad5dd"/>
<text x="58" y="254" font-size="25" font-weight="700" fill="#205f8c" text-anchor="start">독자</text>
<line x1="159" x2="159" y1="218" y2="373" stroke="#cad5dd" stroke-width="1"/>
<text x="184" y="236" font-size="24" font-weight="650" fill="#22272b" text-anchor="start">강의 학습</text>
<text x="184" y="268" font-size="20" font-weight="450" fill="#546471" text-anchor="start">구간을 선택하고 영상을 보면서 노트를 읽는다.</text>
<text x="184" y="327" font-size="24" font-weight="650" fill="#22272b" text-anchor="start">내 학습 기록</text>
<text x="184" y="359" font-size="20" font-weight="450" fill="#546471" text-anchor="start">로그인하면 강의를 북마크하고 문장에 메모를 남긴다.</text>
<line x1="184" x2="740" y1="285" y2="285" stroke="#cad5dd" stroke-width="1"/>
</svg>
