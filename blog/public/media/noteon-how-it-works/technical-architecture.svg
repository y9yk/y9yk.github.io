<svg xmlns="http://www.w3.org/2000/svg" width="800" height="347" viewBox="0 0 800 347" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
<title id="title">NoteOn의 기술 구성</title>
<desc id="desc">브라우저의 프런트엔드가 Next.js 백엔드에서 강의를 읽고 로그인 세션으로 개인 기록을 Supabase에 저장한다. 인증과 로깅은 여러 구성 요소에 걸쳐 작동하고 데이터 처리 도구는 배포 전에 강의 자료를 준비한다.</desc>
