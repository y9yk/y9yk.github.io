<svg xmlns="http://www.w3.org/2000/svg" width="800" height="412" viewBox="0 0 800 412" role="img" aria-labelledby="title desc" lang="ko" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#22272b">
  <title id="title">강의 화면 와이어프레임</title>
  <desc id="desc">재생 화면에서는 큰 영상과 핵심 구간이 나란히 있고, 아래로 내리면 작은 플레이어와 목차 옆에 본문과 재생 시각, 문장 메모가 놓인다.</desc>
